<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conversation</title>
    <style>
        #chat-log {
            width: 100%;
            height: 400px;
            border: 1px solid black;
            overflow-y: scroll;
            padding: 10px;
        }
        #message-input {
            width: 100%;
        }
        .message {
            margin-bottom: 10px;
        }
        .message strong {
            color: #333;
        }
        .message em {
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>Conversation avec {{ conversation.advisor.username }}</h1>
    <div id="chat-log">
        {% for message in messages %}
            <div class="message">
                <p><strong>{{ message.sender.username }}:</strong> {{ message.content }} <em>{{ message.timestamp }}</em></p>
            </div>
        {% endfor %}
    </div>
    <form id="chat-form">
        {% csrf_token %}
        <input type="text" id="message-input" name="message">
        <button type="submit" id="send-button">Envoyer</button>
    </form>

    <script>
            const chatLog = document.getElementById('chat-log');
            const messageInput = document.getElementById('message-input');
            const sendButton = document.getElementById('send-button');
            const roomName = "{{ conversation.name }}";  // Use the unique conversation name
            const chatSocket = new WebSocket(
                'ws://' + window.location.host + '/ws/chat/' + roomName + '/'
            );
        
            chatSocket.onopen = function(e) {
                console.log('WebSocket connection opened');  // Log when the connection opens
            };
        
            chatSocket.onmessage = function(e) {
                const data = JSON.parse(e.data);
                console.log('Received message:', data);  // Log received message for debugging
                const message = document.createElement('div');
                message.classList.add('message');
                message.innerHTML = `<p><strong>${data.username}:</strong> ${data.message} <em>${data.timestamp}</em></p>`;
                chatLog.appendChild(message);
                chatLog.scrollTop = chatLog.scrollHeight;  // Scroll to the bottom when a new message arrives
            };
        
            chatSocket.onclose = function(e) {
                console.log('WebSocket connection closed');  // Log when the connection closes
            };
        
            chatSocket.onerror = function(e) {
                console.error('WebSocket error:', e);  // Log any WebSocket errors
            };
        
            sendButton.onclick = function(e) {
                const message = messageInput.value;
                console.log('Sending message:', message);  // Log sent message for debugging
                chatSocket.send(JSON.stringify({
                    'message': message,
                    'username': '{{ user.username }}',
                    'timestamp': new Date().toISOString()
                }));
                messageInput.value = '';
            };
        
            chatLog.scrollTop = chatLog.scrollHeight;
    </script>
</body>
</html>
